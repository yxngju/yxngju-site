<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yxngju</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #d8cba9;
    --ink: #1c1712;
    --soft: #5a4f40;
    --blue: #1f3a93;
    --line: rgba(28,23,18,.28);
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--wall); color: var(--ink);
    font-family: "Vazirmatn", Tahoma, sans-serif; line-height: 1.9;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 22px; }

  nav { display: flex; gap: 22px; padding: 22px 0; font-weight: 600; }
  nav a { text-decoration: none; }
  nav a:hover { color: var(--blue); }

  .hero { padding: 70px 0 60px; }
  .name {
    position: relative; display: inline-block;
    font-size: clamp(3.2rem, 15vw, 6.5rem); font-weight: 900; line-height: 1.2;
    direction: ltr; padding: 0 .25em;
  }
  .name svg { position: absolute; inset: -12% -6%; width: 112%; height: 124%; overflow: visible; }
  .name path {
    fill: none; stroke: var(--blue); stroke-width: 3.5; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw 1.4s .3s ease-out forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .bio { margin-top: 28px; font-size: 1.15rem; max-width: 34em; }

  section { padding: 40px 0; }
  h2 { font-size: 1.6rem; font-weight: 900; margin-bottom: 16px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .filters button {
    font: inherit; font-size: .95rem; cursor: pointer; color: var(--ink);
    background: none; border: 2px solid var(--ink); border-radius: 99px; padding: 2px 16px;
  }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--wall); }

  .project { display: block; text-decoration: none; padding: 18px 0; border-top: 2px solid var(--line); }
  .project:last-child { border-bottom: 2px solid var(--line); }
  .project h3 { font-size: 1.2rem; font-weight: 600; }
  .project:hover h3 { color: var(--blue); }
  .project p { color: var(--soft); }
  .tag { font-size: .85rem; color: var(--blue); font-weight: 600; }
  .empty { color: var(--soft); padding: 18px 0; }

  .links { display: flex; flex-wrap: wrap; gap: 10px 26px; }
  .links a { font-weight: 600; text-decoration-thickness: 2px; text-underline-offset: 5px; }
  .links a:hover { color: var(--blue); }

  footer { padding: 50px 0 40px; color: var(--soft); font-size: .9rem; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .name path { animation: none; stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <nav>
    <a href="#about">درباره من</a>
    <a href="#projects">کارها</a>
    <a href="#contact">ارتباط</a>
  </nav>

  <header class="hero" id="about">
    <h1 class="name">
      <span id="siteName">yxngju</span>
      <svg viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true">
        <path pathLength="1" d="M150 6 C 60 4, 8 28, 12 52 C 16 80, 90 96, 168 94 C 250 92, 292 66, 288 40 C 284 14, 220 4, 130 10"/>
      </svg>
    </h1>
    <p class="bio" id="bio"></p>
  </header>

  <section id="projects">
    <h2>کارها</h2>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </section>

  <section id="contact">
    <h2>ارتباط</h2>
    <div class="links" id="links"></div>
  </section>

  <footer>© <span id="year"></span> <span id="footName"></span></footer>
</div>

<script>
/* ===== اینجا را شخصی‌سازی کن ===== */
const CONFIG = {
  name: "yxngju",
  bio: "اینجا کارهام رو جمع می‌کنم: کد، طراحی و هر چیزی که می‌سازم.",
  links: [
    { label: "GitHub", url: "https://github.com/yxngju" },
    // { label: "Instagram", url: "https://instagram.com/..." },
  ],
  /* برای اضافه کردن کار جدید، یک خط به این لیست اضافه کن.
     tag: دسته‌بندی (مثلا کد، هنر، طراحی) */
  projects: [
    { title: "سایت شخصی", desc: "همین صفحه‌ای که الان می‌بینی.", tag: "کد", url: "https://github.com/yxngju/yxngju-site" },
    { title: "کار نمونه", desc: "این را با کار واقعی خودت عوض کن.", tag: "هنر", url: "" },
  ],
};
/* ================================== */

const $ = id => document.getElementById(id);
document.title = CONFIG.name;
$("siteName").textContent = CONFIG.name;
$("footName").textContent = CONFIG.name;
$("bio").textContent = CONFIG.bio;
$("year").textContent = new Date().getFullYear();

CONFIG.links.forEach(l => {
  const a = document.createElement("a");
  a.href = l.url; a.textContent = l.label; a.target = "_blank"; a.rel = "noopener";
  $("links").append(a);
});

const tags = ["همه", ...new Set(CONFIG.projects.map(p => p.tag).filter(Boolean))];
let active = "همه";

function render() {
  const list = $("list");
  list.replaceChildren();
  const items = CONFIG.projects.filter(p => active === "همه" || p.tag === active);
  if (!items.length) {
    const e = document.createElement("p");
    e.className = "empty"; e.textContent = "هنوز کاری در این دسته نیست.";
    list.append(e); return;
  }
  items.forEach(p => {
    const el = document.createElement(p.url ? "a" : "div");
    el.className = "project";
    if (p.url) { el.href = p.url; el.target = "_blank"; el.rel = "noopener"; }
    const t = document.createElement("span"); t.className = "tag"; t.textContent = p.tag || "";
    const h = document.createElement("h3"); h.textContent = p.title;
    const d = document.createElement("p"); d.textContent = p.desc || "";
    el.append(t, h, d); list.append(el);
  });
}

function renderFilters() {
  const box = $("filters");
  box.replaceChildren();
  if (tags.length < 3) return;
  tags.forEach(t => {
    const b = document.createElement("button");
    b.textContent = t; b.setAttribute("aria-pressed", t === active);
    b.onclick = () => { active = t; renderFilters(); render(); };
    box.append(b);
  });
}

renderFilters(); render();
</script>
</body>
</html>
